
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Inventory</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <h1>Book Inventory</h1>

  <table>
    <thead>
      <tr>
        <th>Title</th>
        <th>Author</th>
        <th>Category</th>
        <th><span class="status">Status</th>
        <th>Rate
          <span></span>
          <span></span>
          <span></span>
          </span>
        </th>
      </tr>
    </thead>

  <tbody>
     <tr class="read">
        <td>Title</td>
        <td>Author</td>
        <td>Category</td>
        <td><span class="status">Read</span></td>
        <td>Rate<span class="rate one">
          <span></span>
          <span></span>
          <span></span>
          </span></td>
      </tr>
     <tr class="to-read">
      <td>Title</td>
        <td>Author</td>
        <td>Category</td>
        <td><span class="status">To Read</span></td>
        <td>Rate<span class="rate">
          <span></span>
          <span></span>
          <span></span>
          </span></td>
     </tr>
     <tr class="in-progress">
      <td>Title</td>
        <td>Author</td>
        <td>Category</td>
        <td><span class="status">In Progress</span></td>
        <td>Rate<span class="rate">
        <span></span>
        <span></span>
        <span></span>
        </span>
        </td>
     </tr>
    </tbody>
